<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>smart scroll</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <span class="logo-dot"></span>
        <span class="brand-text">smart scroll</span>
      </div>
      <div class="mode-pill">
        <button id="type-all" class="mode-btn active">all</button>
        <button id="type-sat" class="mode-btn">sat</button>
        <button id="type-chem" class="mode-btn">chem</button>
      </div>
    </header>

    <main>
      <section id="stats-bar">
        <div class="stat-block">
          <div class="stat-label">today (pst)</div>
          <div class="stat-value"><span id="today-correct">0</span> / <span id="daily-goal">300</span></div>
          <div class="progress-shell">
            <div id="progress-fill"></div>
          </div>
        </div>
        <div class="stat-block">
          <div class="stat-label">streak (days hit goal)</div>
          <div class="stat-value" id="streak-days">0</div>
        </div>
      </section>

      <section id="card-shell">
        <div id="card" class="card">
          <div class="card-tag" id="card-tag"></div>
          <div class="card-question" id="card-question"></div>
          <div class="card-options" id="options-container">
            <!-- options injected by js -->
          </div>
        </div>
        <button id="next-btn" class="ghost-btn">next question ↻</button>
      </section>

      <section id="gyros-section" class="hidden">
        <div class="section-header">
          <span class="section-title">gyros unlocked</span>
          <span class="section-subtitle">daily goal hit. spin the core.</span>
        </div>
        <div id="gyros-card">
            <div id="gyros-arena">
                <div id="gyro-circle"></div>
                <div id="gyro-ship"></div>
            </div>

          <div class="gyros-ui">
            <button id="gyro-lock-btn">lock</button>
            <div class="gyros-stats">
              score: <span id="gyro-score">0</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="confetti-layer"></div>

  <script src="cards.js"></script>
  <script src="script.js"></script>
</body>
</html>
